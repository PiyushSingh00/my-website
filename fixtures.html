<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-K270FM9R19"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-K270FM9R19');

  <meta charset="UTF-8" />
    <title>ScheduleIt – Tournament fixtures</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles/fixtures.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand brand-link" href="index.html" aria-label="Go to homepage">ScheduleIt</a>

        <div class="topbar-right">
          <div class="user-menu">
            <button
              type="button"
              class="user-avatar-btn"
              id="host-user-menu-trigger"
              aria-label="User menu"
            >
              U
            </button>

            <div class="user-menu-dropdown" id="host-user-menu-dropdown">
              <button type="button" class="dropdown-item" id="dropdown-signout">
                Sign out
              </button>
            </div>
          </div>

          <div class="mode-toggle" role="group" aria-label="Mode toggle">
            <button class="mode-btn" id="mode-player-btn" type="button">Join mode</button>
            <button class="mode-btn is-active" id="mode-host-btn" type="button">Host mode</button>
          </div>
        </div>
      </header>

      <main class="main">
        <section class="fixtures-card">
          <header class="fixtures-header">
            <p class="eyebrow" id="fixtures-page-kicker">Knockout fixtures</p>
            <h1 id="fixtures-tournament-name">Tournament name</h1>
            <p class="helper-text fixtures-meta">
              <span id="fixtures-tournament-sport"></span>
              <span id="fixtures-tournament-dates"></span>
              <span>Code: <span id="fixtures-tournament-code"></span></span>
            </p>
          </header>

          <div class="fixtures-toolbar">
            <button type="button" class="btn-dark" id="fixtures-back-btn">← Back</button>

            <button type="button" class="btn-primary" id="fixtures-generate-btn">
              Regenerate fixtures
            </button>

            <button type="button" class="btn-dark" id="fixtures-configure-fields-btn">
              Configure scoring fields
            </button>

            <button type="button" class="btn-dark" id="fixtures-edit-btn" style="display:none;">
              Edit fixtures
            </button>
          </div>

          <div id="fixtures-toast" class="fixtures-toast" style="display:none;">
            ✓ Done
          </div>

          <p class="helper-text" id="fixtures-helper-text">
            Fixtures are auto-generated in random order for each category.
            BYE indicates a free pass to the next round.
          </p>

          <div class="fixtures-toggle" id="fixtures-toggle"></div>

          <div
            id="fixtures-none-selected"
            class="empty-state"
            style="display:flex;"
          >
            <div class="feature-icon">🎯</div>
            <h3>Choose which fixtures to view</h3>
            <p class="muted">
              Select a <strong>Category</strong> above to see the tournament view.
            </p>
          </div>

          <div id="fixtures-groups"></div>
        </section>
      </main>
    </div>

    <script type="module" src="scripts/fixtures.js"></script>
  </body>
</html>
