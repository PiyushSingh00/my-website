<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ScheduleIt – Create team</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles/team.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand brand-link" href="index.html" aria-label="Go to homepage">ScheduleIt</a>

        <div class="topbar-right">
          <div class="user-menu">
            <button
              type="button"
              class="user-avatar-btn"
              id="team-user-menu-trigger"
              aria-label="User menu"
            >
              U
            </button>

            <div class="user-menu-dropdown" id="team-user-menu-dropdown">
              <button type="button" class="dropdown-item" id="dropdown-signout">
                Sign out
              </button>
            </div>
          </div>

          <div class="mode-toggle" role="group" aria-label="Mode toggle">
            <button class="mode-btn is-active" id="mode-player-btn" type="button">
              Join mode
            </button>
            <button class="mode-btn" id="mode-host-btn" type="button">
              Host mode
            </button>
          </div>
        </div>
      </header>

      <main class="team-main">
        <section class="team-card">
          <div class="team-head">
            <div>
              <p class="eyebrow">Captain area</p>
              <h1 id="team-page-title">Create team</h1>
              <p class="helper-text" id="team-page-subtitle">
                Build your team from the players registered in this tournament.
              </p>
            </div>

            <button type="button" class="btn-dark" id="team-back-btn">← Back</button>
          </div>

          <div class="team-meta-grid">
            <div class="meta-chip">
              <span class="meta-label">Tournament</span>
              <span class="meta-value" id="team-tournament-name">-</span>
            </div>

            <div class="meta-chip">
              <span class="meta-label">Sport</span>
              <span class="meta-value" id="team-tournament-sport">-</span>
            </div>

            <div class="meta-chip">
              <span class="meta-label">Dates</span>
              <span class="meta-value" id="team-tournament-dates">-</span>
            </div>

            <div class="meta-chip">
              <span class="meta-label">Team rule</span>
              <span class="meta-value" id="team-size-rule">-</span>
            </div>
          </div>

          <form id="team-form">
            <div class="field-group">
              <label for="team-name-input">Team name <span class="optional">(optional)</span></label>
              <input
                id="team-name-input"
                type="text"
                placeholder="Enter team name"
              />
            </div>

            <div class="field-group" id="team-category-wrap">
              <label for="team-category-select">Category</label>
              <select id="team-category-select">
                <option value="">Select category</option>
              </select>
            </div>

            <div class="rules-box">
              <h3>Selection rules</h3>
              <p class="helper-text" id="team-rule-text">
                Choose players to continue.
              </p>
            </div>

            <div class="players-section">
              <div class="players-section-head">
                <div>
                  <h3>Selected players</h3>
                  <p class="helper-text">Choose players from the tournament registration list.</p>
                </div>

                <button type="button" class="btn-dark" id="add-player-row-btn">
                  + Add player
                </button>
              </div>

              <div id="team-player-rows" class="team-player-rows"></div>
            </div>

            <div class="team-summary">
              <div class="summary-chip">
                <span class="summary-label">Players selected</span>
                <span class="summary-value" id="selected-count">0</span>
              </div>

              <div class="summary-chip">
                <span class="summary-label">Required</span>
                <span class="summary-value" id="required-count">-</span>
              </div>
            </div>

            <div class="form-actions">
              <button type="button" class="btn-dark" id="save-draft-btn">Save draft</button>
              <button type="submit" class="btn-primary">Invite players</button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script type="module" src="scripts/team.js"></script>
  </body>
</html>
