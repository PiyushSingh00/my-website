<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Scoring Fields</title>
  <link rel="stylesheet" href="host.css" />
  <link rel="stylesheet" href="fixtures.css" />
  <style>
    .schema-wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .schema-top { display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
    .schema-actions { display:flex; gap:10px; flex-wrap:wrap; }
    .schema-list { margin-top:16px; display:grid; grid-template-columns:1fr; gap:10px; }
    .schema-item { background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 12px 14px; display:flex; gap:12px; align-items:flex-start; }
    .schema-item h4 { margin:0; font-size: 14px; }
    .schema-meta { opacity: 0.8; font-size: 12px; margin-top: 4px; }
    .pill { display:inline-block; padding: 3px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.18); font-size: 12px; opacity: 0.9; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .modal-backdrop { position:fixed; inset:0; background: rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; padding:16px; }
    .modal { width: 100%; max-width: 560px; background:#0b1220; border:1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 16px; }
    .modal input, .modal select, .modal textarea { width:100%; padding:10px; border-radius: 10px; border:1px solid rgba(255,255,255,0.18); background: rgba(0,0,0,0.25); color:#fff; }
    .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="schema-wrap">
    <div class="schema-top">
      <div>
        <h2 style="margin:0;">Scoring Fields</h2>
        <div id="schemaSub" class="schema-meta"></div>
      </div>
      <div class="schema-actions">
        <button id="btnSuggest" class="btn btn-primary">Generate AI Suggestions</button>
        <button id="btnSelectAll" class="btn">Select all</button>
        <button id="btnSelectNone" class="btn">Select none</button>
        <button id="btnAddField" class="btn">+ Add custom field</button>
        <button id="btnFinalize" class="btn btn-success">Finalize & Save</button>
      </div>
    </div>

    <div class="row" style="margin-top:14px;">
      <span class="pill" id="pillCategory"></span>
      <span class="pill" id="pillSport"></span>
    </div>

    <div id="schemaList" class="schema-list"></div>
  </div>

  <!-- Add field modal -->
  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal">
      <h3 style="margin-top:0;">Add Custom Field</h3>
      <div class="grid2">
        <div>
          <label>Label</label>
          <input id="fLabel" placeholder="e.g. Tackles won" />
        </div>
        <div>
          <label>Key</label>
          <input id="fKey" placeholder="e.g. tacklesWon" />
        </div>
      </div>

      <div class="grid2" style="margin-top:10px;">
        <div>
          <label>Type</label>
          <select id="fType">
            <option value="counter">counter (+/-)</option>
            <option value="number">number</option>
            <option value="boolean">boolean</option>
            <option value="select">select</option>
            <option value="text">text</option>
          </select>
        </div>
        <div>
          <label>Group</label>
          <input id="fGroup" placeholder="custom" value="custom" />
        </div>
      </div>

      <div class="grid2" style="margin-top:10px;">
        <div>
          <label>Level</label>
          <select id="fLevel">
            <option value="basic">basic</option>
            <option value="intermediate">intermediate</option>
            <option value="advanced">advanced</option>
            <option value="pro" selected>pro</option>
          </select>
        </div>
        <div>
          <label>Order</label>
          <input id="fOrder" type="number" value="999" />
        </div>
      </div>

      <div class="grid2" style="margin-top:10px;">
        <div>
          <label>Default</label>
          <input id="fDefault" value="0" />
        </div>
        <div>
          <label>Help</label>
          <input id="fHelp" placeholder="Optional helper text" />
        </div>
      </div>

      <div class="row" style="margin-top:12px; justify-content:flex-end;">
        <button id="btnCloseModal" class="btn">Cancel</button>
        <button id="btnSaveField" class="btn btn-success">Add field</button>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="schema.js"></script>
</body>
</html>
