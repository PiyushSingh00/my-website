<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ScheduleIt – Scoring Fields</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Fonts (match fixtures.html / schedule.html style) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- IMPORTANT: use correct folder -->
    <link rel="stylesheet" href="styles/fixtures.css" />
    <!-- Optional: if you create schema.css later, add it like this:
    <link rel="stylesheet" href="styles/schema.css" />
    -->
  </head>

  <body>
    <div class="app-shell">
      <!-- Top bar (same structure as fixtures.html) -->
      <header class="topbar">
        <a class="brand brand-link" href="index.html" aria-label="Go to homepage"
          >ScheduleIt</a
        >

        <div class="topbar-right">
          <div class="user-menu">
            <button
              type="button"
              class="user-avatar-btn"
              id="host-user-menu-trigger"
              aria-label="User menu"
            >
              U
            </button>

            <div class="user-menu-dropdown" id="host-user-menu-dropdown">
              <button type="button" class="dropdown-item" id="dropdown-signout">
                Sign out
              </button>
            </div>
          </div>

          <div class="mode-toggle" role="group" aria-label="Mode toggle">
            <button class="mode-btn" id="mode-player-btn" type="button">
              Join mode
            </button>
            <button class="mode-btn is-active" id="mode-host-btn" type="button">
              Host mode
            </button>
          </div>
        </div>
      </header>

      <main class="main">
        <section class="fixtures-card">
          <header class="fixtures-header">
            <p class="eyebrow">Scoring Fields</p>
            <h1>Scoring Fields</h1>
            <p class="helper-text fixtures-meta">
              <span>Tournament: <span id="schema-tournament-id">—</span></span>
            </p>
          </header>

          <div class="fixtures-toolbar">
            <button type="button" class="btn-dark" id="schema-back-btn">
              ← Back to fixtures
            </button>

            <button type="button" class="btn-primary" id="schema-generate-btn">
              Generate AI Suggestions
            </button>

            <button type="button" class="btn-dark" id="schema-select-all">
              Select all
            </button>

            <button type="button" class="btn-dark" id="schema-select-none">
              Select none
            </button>

            <button type="button" class="btn-dark" id="schema-add-custom">
              + Add custom field
            </button>

            <button type="button" class="btn-primary" id="schema-finalize-btn">
              Finalize & Save
            </button>
          </div>

          <p class="helper-text" style="margin-top: 10px;">
            Category: <strong id="schema-category-id">—</strong>
            &nbsp; • &nbsp;
            Sport: <strong id="schema-sport-name">—</strong>
          </p>

          <div id="schema-error" class="fixtures-toast" style="display:none; margin-top: 12px;">
            Error
          </div>

          <div style="margin-top: 14px;">
            <p id="schema-empty" class="helper-text">
              No draft schema yet. Click “Generate AI Suggestions”.
            </p>

            <div id="schema-fields-list"></div>
          </div>
        </section>
      </main>
    </div>

    <!-- IMPORTANT: module entrypoint (this file imports auth.js etc) -->
    <script type="module" src="scripts/schema.js"></script>
  </body>
</html>
