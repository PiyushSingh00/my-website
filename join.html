<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ScheduleIt – Join tournaments</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles/join.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand brand-link" href="index.html" aria-label="Go to homepage">ScheduleIt</a>

        <div class="topbar-right">
          <div class="user-menu">
            <button
              type="button"
              class="user-avatar-btn"
              id="join-user-menu-trigger"
              aria-label="User menu"
            >
              U
            </button>

            <div class="user-menu-dropdown" id="join-user-menu-dropdown">
              <button type="button" class="dropdown-item" id="dropdown-signout">
                Sign out
              </button>
            </div>
          </div>

          <div class="mode-toggle" role="group" aria-label="Mode toggle">
            <button class="mode-btn is-active" id="mode-player-btn" type="button">
              Join mode
            </button>
            <button class="mode-btn" id="mode-host-btn" type="button">
              Host mode
            </button>
          </div>
        </div>
      </header>

      <main class="join-main">
        <div class="join-shell">
          <aside class="join-sidebar" id="join-sidebar">
            <div class="join-sidebar-head">
              <h2>Join panel</h2>
              <button
                type="button"
                class="sidebar-toggle-btn"
                id="join-sidebar-toggle"
                aria-label="Toggle sidebar"
              >
                ☰
              </button>
            </div>

            <nav class="join-nav">
              <button type="button" class="join-nav-btn active" data-view="browse">
                <span>Browse tournaments</span>
              </button>
              <button type="button" class="join-nav-btn" data-view="my">
                <span>My tournaments</span>
              </button>
              <button type="button" class="join-nav-btn" data-view="notifications">
                <span>Notifications</span>
              </button>
            </nav>
          </aside>

          <section class="join-content">
            <!-- BROWSE -->
            <section class="join-view join-view--active" id="join-view-browse">
              <div class="join-card">
                <div class="join-card-head">
                  <div>
                    <p class="eyebrow">Join a tournament</p>
                    <h1>Browse tournaments</h1>
                  </div>
                </div>

                <div class="join-form-row">
                  <input
                    type="text"
                    id="join-code-input"
                    placeholder="Enter code or open shared tournament"
                  />
                  <button type="button" class="btn-primary" id="join-code-btn">Validate code</button>
                </div>

                <div id="browse-tournaments-list" class="browse-list"></div>
              </div>
            </section>

            <!-- MY TOURNAMENTS -->
            <section class="join-view" id="join-view-my">
              <div class="join-card">
                <div class="join-card-head">
                  <div>
                    <p class="eyebrow">Your activity</p>
                    <h1>My tournaments</h1>
                  </div>
                </div>

                <div id="my-joined-tournaments" class="browse-list"></div>
              </div>
            </section>

            <!-- NOTIFICATIONS -->
            <section class="join-view" id="join-view-notifications">
              <div class="join-card">
                <div class="join-card-head">
                  <div>
                    <p class="eyebrow">Updates</p>
                    <h1>Notifications</h1>
                  </div>
                </div>

                <div id="join-notifications-list" class="browse-list"></div>

                <section id="team-invite-section" class="team-invite-section hidden">
                  <div class="section-head">
                    <div>
                      <p class="eyebrow">Team requests</p>
                      <h2 class="section-title">Team invites</h2>
                    </div>
                  </div>

                  <div id="team-invite-list" class="browse-list"></div>
                </section>
              </div>
            </section>
          </section>
        </div>
      </main>
    </div>

    <script type="module" src="scripts/join.js"></script>
  </body>
</html>
