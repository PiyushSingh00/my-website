<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ScheduleIt – Tournament schedule</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles/join.css" />
    <link rel="stylesheet" href="styles/schedule.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">ScheduleIt</div>

        <div class="topbar-right">
          <div class="user-menu">
            <button
              type="button"
              class="user-avatar-btn"
              id="schedule-user-menu-trigger"
              aria-label="User menu"
            >
              U
            </button>

            <div class="user-menu-dropdown" id="schedule-user-menu-dropdown">
              <button type="button" class="dropdown-item" id="dropdown-signout">
                Sign out
              </button>
            </div>
          </div>

          <div class="mode-toggle" role="group" aria-label="Mode toggle">
            <button class="mode-btn is-active" id="mode-player-btn" type="button">Join mode</button>
            <button class="mode-btn" id="mode-host-btn" type="button">Host mode</button>
          </div>
        </div>
      </header>

      <main class="schedule-main">
        <header class="schedule-header">
          <button type="button" id="back-to-join" class="back-link-btn">
            ← Back to tournaments
          </button>

          <div class="schedule-title-block">
            <h1 id="schedule-tournament-name">Tournament</h1>
            <p id="schedule-tournament-meta" class="helper-text schedule-meta"></p>
          </div>
        </header>

        <section class="schedule-card">
          <p id="schedule-empty" class="helper-text">
            Host has not published the schedule yet. Please check again later.
          </p>

          <div id="schedule-content-wrap" style="display: none;">
            <div class="schedule-view-tabs" id="schedule-view-tabs">
              <button type="button" class="schedule-view-tab active" data-view="bracket">
                Tournament schedule
              </button>
              <button type="button" class="schedule-view-tab" data-view="live">
                View live score
              </button>
            </div>

            <!-- BRACKET VIEW -->
            <div id="schedule-bracket-wrap" class="schedule-bracket-wrap">
              <div id="schedule-category-toggle" class="schedule-category-toggle"></div>

              <div id="schedule-none-selected" class="empty-state" style="display:flex;">
                <div class="feature-icon">🎯</div>
                <h3>Choose which fixtures to view</h3>
                <p class="muted">
                  Select a <strong>Category</strong> above to see the knockout bracket.
                </p>
              </div>

              <div id="schedule-groups"></div>
            </div>

            <!-- LIVE SCORE VIEW -->
            <div id="schedule-live-wrap" class="schedule-live-wrap" style="display:none;">
              <div id="schedule-live-empty" class="empty-state" style="display:none;">
                <div class="feature-icon">📡</div>
                <h3>No live matches right now</h3>
                <p class="muted">
                  Ongoing matches with saved scores will appear here.
                </p>
              </div>

              <div id="schedule-live-list" class="schedule-live-list"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="scripts/schedule.js"></script>
  </body>
</html>
