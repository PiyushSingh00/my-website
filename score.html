<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ScheduleIt – Score match</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Reuse host look & feel -->
    <link rel="stylesheet" href="styles/host.css" />
    <!-- Score page specific CSS -->
    <link rel="stylesheet" href="styles/score.css" />
  </head>

  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">ScheduleIt</div>
        <div class="topbar-right">
          <button class="signout-btn" id="signout-btn" type="button">Sign out</button>
        </div>
      </header>

      <main class="main">
        <section class="score-card">
          <header class="score-header">
            <p class="eyebrow">Match scoring</p>
            <h1 id="score-title">Loading…</h1>
            <p class="score-sub" id="score-sub"></p>
          </header>

          <div class="fixtures-toolbar score-toolbar">
            <button type="button" class="btn-dark" id="back-to-fixtures">← Back to fixtures</button>
            <button type="button" class="btn-primary" id="save-score">Save score</button>
          </div>

          <div class="timer-row">
            <div class="pill">
              Timer: <strong class="timer-time" id="timer-display">00:00</strong>
            </div>
            <button type="button" class="btn-dark" id="timer-start">Start</button>
            <button type="button" class="btn-dark" id="timer-pause">Pause</button>
            <button type="button" class="btn-dark" id="timer-reset">Reset</button>
            <button id="btnAddFieldMidGame" class="btn-dark" type="button">+ Add field mid-game</button>
          </div>

          <div class="actions">
            <div class="pill" id="status-pill">Status: <strong>pending</strong></div>
            <div class="pill" id="winner-pill">Winner: <strong>-</strong></div>
            <div class="pill" id="reason-pill">Reason: <strong>-</strong></div>
          </div>

          <div class="score-grid">
            <div class="panel">
              <h2>Match settings</h2>
              <div id="config-fields"></div>
            </div>

            <div class="panel">
              <h2>Players</h2>
              <div class="teams-wrap" id="teams-wrap"></div>
            </div>
          </div>

          <div id="save-msg" class="pill save-msg"></div>
        </section>
      </main>
    </div>

    <script type="module" src="scripts/score.js"></script>
  </body>
</html>
