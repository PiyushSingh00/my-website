<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ScheduleIt – Score match</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles/score.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand brand-link" href="index.html" aria-label="Go to homepage">ScheduleIt</a>

        <div class="topbar-right">
          <div class="user-menu">
            <button
              type="button"
              class="user-avatar-btn"
              id="score-user-menu-trigger"
              aria-label="User menu"
            >
              U
            </button>

            <div class="user-menu-dropdown" id="score-user-menu-dropdown">
              <button type="button" class="dropdown-item" id="dropdown-signout">
                Sign out
              </button>
            </div>
          </div>

          <div class="mode-toggle" role="group" aria-label="Mode toggle">
            <button class="mode-btn" id="mode-player-btn" type="button">Join mode</button>
            <button class="mode-btn is-active" id="mode-host-btn" type="button">Host mode</button>
          </div>
        </div>
      </header>

      <main class="main">
        <div class="action-bar">
          <button type="button" class="ab-btn" id="back-to-fixtures">← Back</button>

          <div class="ab-center">
            <div id="score-title">Match scoring</div>
            <div class="match-meta" id="score-sub">Loading match...</div>
          </div>

          <button type="button" class="ab-btn ab-save" id="save-score">Save</button>
        </div>

        <section class="scoreboard">
          <button type="button" class="team-block" id="team-home">
            <div class="team-name" id="home-name">Home</div>
            <div class="team-score" id="home-score">0</div>
            <div class="team-tap-hint">tap to edit</div>
          </button>

          <div class="scoreboard-center">
            <div class="vs-badge">VS</div>

            <div class="timer-display" id="timer-display">00:00</div>

            <div class="timer-controls">
              <button type="button" class="tc-btn" id="timer-start" aria-label="Start timer">▶</button>
              <button type="button" class="tc-btn" id="timer-pause" aria-label="Pause timer">⏸</button>
              <button type="button" class="tc-btn" id="timer-reset" aria-label="Reset timer">↺</button>
            </div>
          </div>

          <button type="button" class="team-block" id="team-away">
            <div class="team-name" id="away-name">Away</div>
            <div class="team-score" id="away-score">0</div>
            <div class="team-tap-hint">tap to edit</div>
          </button>
        </section>

        <div class="status-row">
          <div class="status-chip" id="status-pill">Status: <strong>pending</strong></div>
          <div class="status-chip" id="winner-pill">Winner: <strong>-</strong></div>
          <div class="status-chip" id="reason-pill">Reason: <strong>-</strong></div>
          <button type="button" class="status-chip chip-btn" id="toggle-settings">⚙ Settings</button>
          <div class="status-chip" id="save-msg">Not saved yet</div>
        </div>

        <section class="settings-panel" id="settings-panel">
          <div class="settings-inner">
            <p class="panel-label">Match settings</p>
            <div id="config-fields"></div>
          </div>
        </section>

        <section class="roster-area" id="roster-area"></section>
      </main>
    </div>

    <div class="stat-drawer-overlay" id="stat-overlay"></div>

    <aside class="stat-drawer" id="stat-drawer" aria-label="Player stats drawer">
      <div class="drawer-head">
        <div>
          <h3 id="drawer-player-name">Player</h3>
          <p id="drawer-team-name" class="helper-text">Team</p>
        </div>
        <button type="button" class="drawer-close" id="drawer-close">✕</button>
      </div>

      <div class="drawer-body" id="drawer-fields"></div>
    </aside>

    <script type="module" src="scripts/score.js"></script>
  </body>
</html>
