<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ScheduleIt – Score match</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Reuse host look & feel -->
    <link rel="stylesheet" href="styles/host.css" />

    <style>
      .score-card {
        width: min(1060px, 100%);
        padding: 22px 22px 18px;
        border-radius: var(--radius-lg);
        background:
          radial-gradient(circle at top left, rgba(77, 208, 225, 0.16), transparent 55%),
          var(--card);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }

      .score-header h1 {
        margin: 0 0 6px;
        font-size: 22px;
      }

      .score-sub {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 13px;
      }

      .score-grid {
        display: grid;
        grid-template-columns: 1fr 1.6fr;
        gap: 14px;
        margin-top: 14px;
      }

      @media (max-width: 920px) {
        .score-grid {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        padding: 14px 14px 12px;
        border-radius: 16px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: rgba(5, 11, 24, 0.72);
      }

      .panel h2 {
        margin: 0 0 10px;
        font-size: 14px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent-2);
      }

      .field {
        display: grid;
        grid-template-columns: 1fr;
        gap: 6px;
        margin-bottom: 12px;
      }

      .field label {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .help {
        font-size: 12px;
        color: rgba(169, 182, 204, 0.75);
        margin-top: 2px;
      }

      .counter {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .counter .value {
        min-width: 54px;
        text-align: center;
        font-weight: 700;
        font-size: 18px;
        padding: 8px 10px;
        border-radius: 14px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: rgba(5, 11, 24, 0.9);
      }

      .mini-btn {
        width: 38px;
        height: 38px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(5, 10, 22, 0.98);
        color: var(--text);
        font-size: 18px;
        cursor: pointer;
      }

      .mini-btn:hover {
        filter: brightness(1.08);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
        align-items: center;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.45);
        background: rgba(5, 11, 24, 0.8);
        color: var(--text);
        font-size: 13px;
      }

      .pill strong {
        color: #fff;
      }

      .error {
        color: #fecaca;
        border-color: rgba(248, 113, 113, 0.75);
        background: rgba(248, 113, 113, 0.12);
      }

      .teams-wrap {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      @media (max-width: 920px) {
        .teams-wrap {
          grid-template-columns: 1fr;
        }
      }

      .team-card {
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 16px;
        background: rgba(5, 11, 24, 0.62);
        padding: 12px;
      }

      .team-title {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 8px;
      }

      .team-title h3 {
        margin: 0;
        font-size: 14px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .team-sub {
        color: rgba(169, 182, 204, 0.75);
        font-size: 12px;
      }

      .player-card {
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 14px;
        background: rgba(5, 11, 24, 0.75);
        padding: 10px;
        margin-top: 10px;
      }

      .player-card h4 {
        margin: 0 0 10px;
        font-size: 13px;
        color: #fff;
      }

      .timer-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-top: 10px;
      }

      .timer-time {
        font-variant-numeric: tabular-nums;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.05em;
      }
    </style>
  </head>

  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">ScheduleIt</div>
        <div class="topbar-right">
          <button class="signout-btn" id="signout-btn" type="button">Sign out</button>
        </div>
      </header>

      <main class="main">
        <section class="score-card">
          <header class="score-header">
            <p class="eyebrow">Match scoring</p>
            <h1 id="score-title">Loading…</h1>
            <p class="score-sub" id="score-sub"></p>
          </header>

          <div class="fixtures-toolbar" style="margin-top: 10px;">
            <button type="button" class="btn-dark" id="back-to-fixtures">← Back to fixtures</button>
            <button type="button" class="btn-primary" id="save-score">Save score</button>
          </div>

          <div class="timer-row">
            <div class="pill">
              Timer: <strong class="timer-time" id="timer-display">00:00</strong>
            </div>
            <button type="button" class="btn-dark" id="timer-start">Start</button>
            <button type="button" class="btn-dark" id="timer-pause">Pause</button>
            <button type="button" class="btn-dark" id="timer-reset">Reset</button>
            <button id="btnAddFieldMidGame" class="btn">+ Add field mid-game</button>
          </div>

          <div class="actions">
            <div class="pill" id="status-pill">Status: <strong>pending</strong></div>
            <div class="pill" id="winner-pill">Winner: <strong>-</strong></div>
            <div class="pill" id="reason-pill">Reason: <strong>-</strong></div>
          </div>

          <div class="score-grid">
            <div class="panel">
              <h2>Match settings</h2>
              <div id="config-fields"></div>
            </div>

            <div class="panel">
              <h2>Players</h2>
              <div class="teams-wrap" id="teams-wrap"></div>
            </div>
          </div>

          <div id="save-msg" class="pill" style="margin-top: 14px; display:none;"></div>
        </section>
      </main>
    </div>

    <script type="module" src="scripts/score.js"></script>
  </body>
</html>
